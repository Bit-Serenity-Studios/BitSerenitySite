<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bit Serenity Studios</title>
<meta name="description" content="Bit Serenity Studios — software crafted with calm intent.">
<style>
  :root {
    --bg: #0b0d10;
    --fg: #e8ecf1;
    --muted: #8b95a3;
    --accent: #6fb1ff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f8fa; --fg: #101317; --muted: #5b6472; --accent: #2563eb; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { min-height: 100svh; display: grid; place-items: center; padding: 6vh 6vw; }
  .card { max-width: 640px; text-align: left; }
  .logo { font-weight: 700; letter-spacing: 0.02em; font-size: clamp(1.75rem, 4vw, 2.75rem);
    margin: 0 0 1rem; }
  .logo span { color: var(--accent); }
  p { color: var(--muted); font-size: clamp(1rem, 1.4vw, 1.125rem); line-height: 1.6;
    margin: 0 0 1.25rem; }
  .rule { width: 3rem; height: 2px; background: var(--accent); margin: 1.5rem 0; opacity: 0.7; }
  footer { color: var(--muted); font-size: 0.85rem; margin-top: 2rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <section class="card">
    <h1 class="logo">Bit Serenity<span>.</span></h1>
    <div class="rule"></div>
    <p>Software crafted with calm intent.</p>
    <p>We're setting up shop. Something thoughtful is on the way.</p>
    <footer>
      &copy; Bit Serenity Studios &middot;
      <a href="mailto:contact@bitserenitystudios.com">contact@bitserenitystudios.com</a>
    </footer>
  </section>
</main>
</body>
</html>
